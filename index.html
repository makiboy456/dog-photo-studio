<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dog Photo Studio</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- 🔝 Навигация -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">🐶 DogStudio</a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      ☰
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#about">О нас</a></li>
        <li class="nav-item"><a class="nav-link" href="#gallery">Галерея</a></li>
        <li class="nav-item"><a class="nav-link" href="#booking">Запись</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- 🧾 О нас -->
<section id="about" class="container my-5">
  <h2>О нас</h2>
  <p>Мы — фотостудия, специализирующаяся на тематических съемках собак. Создаём яркие и уникальные образы для ваших питомцев.</p>
</section>

<!-- 🖼 Галерея -->
<section id="gallery" class="container my-5">
  <h2>Галерея</h2>

  <div class="row">
    <div class="col-md-4">
      <img src="https://placedog.net/400/300?id=1" class="img-fluid rounded">
    </div>
    <div class="col-md-4">
      <img src="https://placedog.net/400/300?id=2" class="img-fluid rounded">
    </div>
    <div class="col-md-4">
      <img src="https://placedog.net/400/300?id=3" class="img-fluid rounded">
    </div>
  </div>
</section>

<!-- 📝 Запись -->
<section id="booking" class="container my-5">
  <h2>Запись на съемку</h2>

  <form id="bookingForm">
    <input type="text" class="form-control mb-3" placeholder="Имя" required>
    <input type="email" class="form-control mb-3" placeholder="Email" required>
    <input type="text" class="form-control mb-3" placeholder="Имя собаки" required>

    <button class="btn btn-primary">Записаться</button>
  </form>
</section>

<!-- 📩 Обратная связь -->
<section class="container my-5">
  <h2>Обратная связь</h2>

  <form id="contactForm">
    <input type="text" class="form-control mb-3" placeholder="Имя" required>
    <input type="email" class="form-control mb-3" placeholder="Email" required>
    <textarea class="form-control mb-3" placeholder="Сообщение" required></textarea>

    <button class="btn btn-success">Отправить</button>
  </form>
</section>

<script src="script.js"></script>
</body>
</html>
